# Tassi di policy: non esiste una fonte unica pubblica e affidabile in formato
# machine-readable per tutte le banche centrali. Sono quindi gestiti come tabella
# aggiornabile via POST /api/v1/admin/rates e mostrati in dashboard con la data
# di ultimo aggiornamento. Se il dato e' piu' vecchio di `giorni_staleness`
# il Rate Differential Score viene penalizzato in confidenza.
tassi_policy:
  giorni_staleness: 45
  # Valori iniziali di bootstrap. VANNO VERIFICATI E AGGIORNATI dall'operatore:
  # sono un punto di partenza, non un dato in tempo reale.
  bootstrap:
    USD: {tasso: 4.00, banca: FED,  aggiornato: "2025-12-10", fonte: "manuale-bootstrap"}
    EUR: {tasso: 2.00, banca: BCE,  aggiornato: "2025-12-18", fonte: "manuale-bootstrap"}
    GBP: {tasso: 4.00, banca: BOE,  aggiornato: "2025-12-18", fonte: "manuale-bootstrap"}
    JPY: {tasso: 0.50, banca: BOJ,  aggiornato: "2025-12-19", fonte: "manuale-bootstrap"}
    AUD: {tasso: 3.60, banca: RBA,  aggiornato: "2025-12-09", fonte: "manuale-bootstrap"}
    CAD: {tasso: 2.25, banca: BOC,  aggiornato: "2025-12-10", fonte: "manuale-bootstrap"}
    CHF: {tasso: 0.00, banca: SNB,  aggiornato: "2025-12-11", fonte: "manuale-bootstrap"}
    NZD: {tasso: 2.25, banca: RBNZ, aggiornato: "2025-11-26", fonte: "manuale-bootstrap"}
