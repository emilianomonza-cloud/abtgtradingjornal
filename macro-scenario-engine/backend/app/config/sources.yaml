# ═══════════════════════════════════════════════════════════════
# SEZIONE 4 — FONTI DATI
# Ogni fonte ha: url, tipo di parser, priorita' (1 = primaria) e abilitazione.
# Il rate limiting globale e' in .env (MSE_MIN_REQUEST_INTERVAL_SECONDS).
# Se una fonte fallisce viene marcata DEGRADED/DOWN e il sistema prosegue con le altre
# ABBASSANDO la confidenza degli scenari (nessun dato inventato).
# ═══════════════════════════════════════════════════════════════

calendario:

  - nome: forexfactory_json
    etichetta: "Forex Factory — feed JSON settimanale"
    # Feed JSON pubblico usato dal widget ufficiale del calendario Forex Factory.
    # E' l'accesso meno invasivo possibile: un solo file statico per settimana,
    # nessuna richiesta alle pagine del sito.
    url: "https://nfs.faireconomy.media/ff_calendar_thisweek.json"
    url_extra:
      - "https://nfs.faireconomy.media/ff_calendar_nextweek.json"
    parser: forexfactory_json
    priorita: 1
    abilitata: true
    note: "Fonte primaria. Nessuna API ufficiale documentata: se il feed cambia formato o blocca, si passa ai fallback."

  - nome: forexfactory_html
    etichetta: "Forex Factory — pagina calendario (fallback)"
    url: "https://www.forexfactory.com/calendar"
    parser: forexfactory_html
    priorita: 2
    abilitata: false   # disattivata di default: usare solo se il feed JSON e' indisponibile
    note: "Scraping HTML. Attivare solo in caso di necessita', rispettando ToS e rate limit."

  - nome: csv_manuale
    etichetta: "Import manuale CSV / API"
    url: null
    parser: csv
    priorita: 3
    abilitata: true
    note: "Sempre disponibile: POST /api/v1/admin/calendar/import (CSV o JSON). Fallback definitivo."

