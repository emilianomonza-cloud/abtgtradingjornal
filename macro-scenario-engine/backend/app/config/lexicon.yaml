# Modificatori: moltiplicano il peso del termine che li precede/segue entro N parole.
negazioni:
  finestra_parole: 4
  termini:
    - "not"
    - "no"
    - "never"
    - "without"
    - "unlikely"
    - "non"
    - "nessun"
    - "nessuna"
    - "senza"
    - "improbabile"
  moltiplicatore: -0.8

intensificatori:
  finestra_parole: 3
  termini:
    - "very"
    - "significantly"
    - "materially"
    - "strongly"
    - "molto"
    - "significativamente"
    - "fortemente"
  moltiplicatore: 1.4

# Temi riconosciuti (SEZIONE 3.4): usati per l'elenco "temi trattati"
temi:
  inflazione:
    - "inflation"
    - "cpi"
    - "price stability"
    - "prices"
    - "inflazione"
    - "prezzi"
  crescita:
    - "growth"
    - "gdp"
    - "activity"
    - "demand"
    - "crescita"
    - "pil"
    - "domanda"
  occupazione:
    - "employment"
    - "labour market"
    - "labor market"
    - "unemployment"
    - "jobs"
    - "wages"
    - "occupazione"
    - "lavoro"
    - "salari"
  rischi:
    - "risk"
    - "uncertainty"
    - "geopolitical"
    - "downside"
    - "upside"
    - "rischio"
    - "incertezza"
    - "geopolitic"
  cambio:
    - "exchange rate"
    - "currency"
    - "fx"
    - "cambio"
    - "valuta"
  bilancio:
    - "balance sheet"
    - "asset purchases"
    - "reinvestment"
    - "bilancio"
    - "reinvestimenti"

# Scala di conversione: punteggio grezzo → tono [-100, +100].
# tono = 100 * tanh(punteggio_grezzo / fattore_saturazione)
fattore_saturazione: 8.0

# Soglie di etichettatura del tono
soglie_tono:
  hawkish: 20
  dovish: -20
