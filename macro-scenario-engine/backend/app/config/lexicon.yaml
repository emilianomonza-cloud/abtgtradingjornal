# ═══════════════════════════════════════════════════════════════
# SEZIONE 3.4 — DIZIONARIO BILINGUE IT/EN PER IL CLASSIFICATORE RULE-BASED
# Ogni voce ha un peso: il tono finale e' la somma pesata normalizzata su [-100, +100].
# Peso positivo = HAWKISH (restrittivo → tassi ↑ → catena TASSI_CAPITALI_CAMBIO → valuta ↑)
# Peso negativo = DOVISH  (accomodante → tassi ↓ → valuta ↓)
# I termini sono confrontati in minuscolo, con confine di parola.
# ═══════════════════════════════════════════════════════════════

